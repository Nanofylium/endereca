[package]
name = "endereca-painel"
version = "0.1.0"
description = "Painel do líder e do gerente operacional"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Binário de distribuição: otimizado, sem símbolos de depuração e sem nomes de funções.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
