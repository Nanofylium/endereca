name: Distribuição

# Gera o APK do app do repositor e o instalador .exe do painel, sem código-fonte:
# o APK sai com Hermes (bytecode) e R8, e o .exe leva o painel minificado dentro do binário.
#
# Configuração do repositório (Settings > Secrets and variables > Actions):
#   Variável ENDERECA_API_URL          endereço https da API (vai para dentro do app e do .exe)
#   Segredo  ANDROID_KEYSTORE_BASE64   keystore de assinatura do APK, em base64
#   Segredos ANDROID_KEYSTORE_SENHA, ANDROID_CHAVE_ALIAS, ANDROID_CHAVE_SENHA
# Sem a keystore o APK sai assinado com a chave de depuração, só para teste.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/distribuicao.yml
      - apps/painel/src-tauri/**
      - apps/mobile/app.config.ts
      - apps/mobile/eas.json

permissions:
  contents: read

env:
  ENDERECA_API_URL: ${{ vars.ENDERECA_API_URL || 'https://api.endereca.invalid' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ENDERECA_DISTRIBUICAO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: node ../../scripts/licencas.mjs .
      - run: npx expo prebuild --platform android --no-install
      - name: Avisos de terceiros dentro do APK
        run: |
          mkdir -p android/app/src/main/assets
          node ../../scripts/licencas.mjs . --avisos android/app/src/main/assets/AVISOS_DE_TERCEIROS.txt
      - name: Keystore de assinatura
        id: keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/endereca.keystore"
            echo "assinado=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sem ANDROID_KEYSTORE_BASE64: o APK sai com a chave de depuração, só para teste."
            echo "assinado=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        env:
          KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          CHAVE_ALIAS: ${{ secrets.ANDROID_CHAVE_ALIAS }}
          CHAVE_SENHA: ${{ secrets.ANDROID_CHAVE_SENHA }}
        run: |
          ASSINATURA=()
          if [ "${{ steps.keystore.outputs.assinado }}" = "1" ]; then
            ASSINATURA=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/endereca.keystore"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_SENHA"
              "-Pandroid.injected.signing.key.alias=$CHAVE_ALIAS"
              "-Pandroid.injected.signing.key.password=$CHAVE_SENHA"
            )
          fi
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a "${ASSINATURA[@]}"
      - name: Confere que não há código-fonte JavaScript no APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          unzip -o -q "$APK" assets/index.android.bundle -d "$RUNNER_TEMP/apk"
          od -An -tx1 -N4 "$RUNNER_TEMP/apk/assets/index.android.bundle" | grep -q 'c6 1f bc 03' \
            || { echo "::error::O bundle não está em bytecode Hermes"; exit 1; }
          if unzip -l "$APK" | grep -E '\.(tsx?|map)$'; then echo "::error::APK com fonte ou source map"; exit 1; fi
      - run: rm -f "$RUNNER_TEMP/endereca.keystore"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: endereca-apk${{ steps.keystore.outputs.assinado == '1' && '' || '-nao-assinado' }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  exe:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/painel
        shell: bash
    env:
      VITE_API_URL: ${{ vars.ENDERECA_API_URL || 'https://api.endereca.invalid' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: npm ci
      - name: Avisos de terceiros dentro do .exe
        run: |
          mkdir -p public
          node ../../scripts/licencas.mjs . --avisos public/AVISOS_DE_TERCEIROS.txt
          cargo about generate --manifest-path src-tauri/Cargo.toml -c src-tauri/about.toml src-tauri/avisos.hbs >> public/AVISOS_DE_TERCEIROS.txt
      - run: npm run desktop:build
      - name: Confere que não há source map no painel
        run: |
          if ls dist/assets/*.map 2>/dev/null; then echo "::error::Build com source map"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: endereca-painel-windows
          path: |
            apps/painel/src-tauri/target/release/bundle/nsis/*.exe
            apps/painel/src-tauri/target/release/endereca-painel.exe
          if-no-files-found: error
